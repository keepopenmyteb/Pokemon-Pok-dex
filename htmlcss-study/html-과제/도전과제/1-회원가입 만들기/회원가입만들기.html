<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>

        body {
        margin: 0;
        padding: 0;
        min-height: 100vh; 
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: flex-start; 
        overflow-y: auto;
      }

      .white-box {
        background-color: white;
        width: 700px;
         padding: 70px 70px;
        margin-top: 40px;
        margin-bottom: 40px;
        border-radius: 30px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      }

        .text{
            height: 20px;
        }

         .button {
        background-color: rgb(130, 23, 231); 
        color: white;
        }

        .button:active {
        background-color: #a556ef; 
        color: #e8e8e8;
        } 


        .checkbox-item label {
        color: rgb(131, 129, 129);
        }

    </style>
</head>
<body style="background-color: black;">
  <div class="white-box" style="margin: 0 auto;">
    <div style="text-align: center;">
    <h1>회원가입</h1>
    <br>
    <h4>OZ코딩스쿨에 오신것을 환영합니다! 🤗</h4>
    </div><br>
    
    <form action="none" method="post">
    <div style="text-align: center;">
    <input type="name" id="name" class="name"
     style="width: 650px; height: 50px; border-radius: 10px;" placeholder="이름">
    <br><br>
    <input type="number" id="number" class="number" 
    style="width: 650px; height: 50px; border-radius: 10px;" placeholder="전화번호">
     <br><br>
    <input type="email" id="email" class="email"
     style="width: 650px; height: 50px; border-radius: 10px;"placeholder="이메일">
     <br><br>
    <input type="password" id="password" class="password"
    style="width: 650px; height: 50px; border-radius: 10px;" placeholder="비밀번호">
     <br><br>
    <input type="date" id="date" class="date"
    style="width: 650px; height: 50px; border-radius: 10px;">
    </div><br>
    </form>

    <div style="text-align: center;">
    <input type="radio">
    <label>남자</label>
    <input type="radio">
    <label>여자</label>
    </div><br>

    <hr style="width: 650px;"><br>
    <div style="text-align: center;">
    <h4 style="width: 250px;">아래 약관에 동의를 눌러주세요</h4>
    </div>

     <div style="text-align: center;" class="checkbox-item" >
    <div style="display: inline-block; text-align: left;">
    <input type="checkbox">
    <label>[필수] 남과 비교하지 않기: 남과 나를 비교하지 않고
      어제의 나와 오늘의 나를 비교하여 얼마나 <br> 성장했는지 가늠해요.
     </label><br><br>
       <input type="checkbox">
    <label> [필수] 시간을 투자하기: 시간을 투자하고 노력할수
        있도록 완성도 있고 성취감 있는 결과를 만들어 낼 <br> 수 있어요.
    </label><br><br>
     <input type="checkbox">
    <label>[필수] 함께성장할 동료만들기: 서로서로 가르쳐주고 배우기도하며 함께할 동료를 만들어보세요.
    <br>함께성장할수록 마지막프로젝트의 완성도 또한 높아진답니다.
     </label><br><br>
       <input type="checkbox">
    <label> 필수] 지원 적극 활용하기: 저희 운영진은 여러분을 위해 상시 대기중...!
    모르는게 있으면 꼭! <br> 물어봐주세요.😘
    </label></div></div><br><br>
    <br>

    <div style="text-align: center;">
    <button class="button" style="width: 650px; height: 50px; border-radius: 10px;">
    <strong>회원가입하기</strong></button>
    </div><br><br>

   <div style="text-align: center;">
   <a href="https://ozcodingschool.com/" style="color:blue; text-decoration: none;">
    오즈코딩스쿨 홈페이지 구경하기 > </a>
    </div>

   </body>
</html>
