<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
    *{
        color: #f78bf2;
        font-family: "Do Hyeon", sans-serif;
    }
</style>
</head>
<body style="background-color: rgb(244, 237, 228);">
    
    <h1>회원가입</h1>
    
    <fieldset>
        <legend>필수 입력사항</legend>
        <ul>
            <li><label>이름:</label>
                <input type="text"></li>
            <li><label>아이디:</label>
                <input type="text"></li>
            <li><label>비밀번호:</label>
                <input type="text"></li>
            <li><label>이메일:</label>
                <input type="text"></li>
            <li><label>휴대폰:</label>
                <input type="text"></li>
            <button>가입하기</button>
            <button>취소</button>
            </ul>
            </fieldset>

            <fieldset> 
                <legend>취미</legend>
            <ul>
                <li><input type="checkbox">
                <label>코딩</label>
                <input type="checkbox">
                <label>운동</label>
                <input type="checkbox">
                <label>숨쉬기</label>
                <input type="checkbox">
                <label>여행</label>
                <input type="checkbox">
                <label>잠자기</label>
                <input type="checkbox">
                <label>독서</label>
                <input type="checkbox">
                <label>넷플시청</label></li>
            </ul>

            <ul>
            <li><input type="radio">
            <label>남</label>
            <input type="radio">
            <label>여</label></li>
            </ul>
            </fieldset>

</body>
</html>
