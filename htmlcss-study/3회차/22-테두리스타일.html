<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델이란</title>
    <style>
        .area{
            width: 200px;
            height: 100px;
        }
        .red{
            border-width: 3px;
            border-style: solid;
            border-color: red;
        }
        .green{
            /* 단축속성은 공백으로 속성값을 서로 구분! */
            border: 3px solid green;

            border-radius: 20px 20px 30px 40px;
        }
    </style>
</head>
<body>
    <h2>노엘 - 비틀비틀</h2>
    <p class="red">비틀비틀 거리는 내 몸이 다시 일어설 수 있게
    나를 꼭 붙잡아줘</p>
    <p class="green">시끌시끌 서울의 소음이 나를 잡아먹기 전에
    내 두 귀를 꼭 막아줘</p>
</body>
</html>
