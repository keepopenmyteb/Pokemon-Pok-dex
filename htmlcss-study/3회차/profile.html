<body>
   <h1 title="인터넷 아기 고양이">아 기 고 양 이</h1> 
   <img src="images/cat.jpg" 
   alt="아기 고양이">

   <div id="introduce">
    <p> 안녕하세요 저는 아기 고양이 라고 합니다.</p>
    <p>저는 인터넷에서 태어나 인터넷 속에 살고 있는 
        작은 아기고양이 입니다.</p>
    <p>
        낮잠 자는걸 좋아해요. 생김새는 털은 차콜색과 하얀색이 섞여있어요. <br> <br>
        키보드 위에서 뒹굴면서 사람들의 궁금증을 해결하는 게 취미에요.
     </p>
   </div>
   <hr>
   <div id="fun-facts">
    <h2>아기고양이 이모저모</h2>
        <p>
            1.<strong>인터넷 놀이터</strong>가 곧 집이에요.<br><br>
            2.집사들이 인터넷 접속할 때마다 놀아줘요.<br><br>
            3.고양이 소리 <mark>이모티콘으로 대화</mark>를 하는 걸 좋아해요.<br><br>
            4.<em>인터넷이 느려지거나 서버가 다운되면</em> 속상하고 우울해요.
        </p>
   </div>
