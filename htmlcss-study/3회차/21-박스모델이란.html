<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델이란</title>
    <style>
        .area{
            /*
                % : 내가 속한 영역을 기준으로 백분율 계산
                => 내가 속한 영역에 관련 값이 잇어야 적용 가능!
            */
            width: 50%;
            height: 50%;
        }
    </style>
</head>
<body>
    <h2>노엘 - 비틀비틀</h2>
    <p>비틀비틀 거리는 내 몸이 다시 일어설 수 있게
    나를 꼭 붙잡아줘</p>
    <p class="area">시끌시끌 서울의 소음이 나를 잡아먹기 전에
    내 두 귀를 꼭 막아줘</p>
</body>
</html>
