<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문서의 흐름</title>
    <style>
        .container{
            height: 400px;
            border: 1px solid black;
        }

        #first{
            float: left;
        }

        #second{
            float: right;
        }
        p{
            clear: both;
        }
    </style>
</head>
<body>
    <div class="container">
    <img id="first"
     src="images/seoul.jpg" width="160">
    <img id="second" 
    src="images/seoul.jpg" width="160">
    <p>
        서울은 대한민국의 수도이자 경제, 정치, 문화의 중심지이며,
         약 2,000년의 깊은 역사를 간직한 도시입니다.<br>
         대한민국에 수도의 역할을 해왔으며, 1949년 특별시로 지정되어 서울특별시라는
          행정 명칭을 사용하고 있습니다. 
     </p>
    </div>
</body>
</html>
