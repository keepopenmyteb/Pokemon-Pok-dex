<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자 알아보기</title>
    <style>
        /* 
        기호와 함께 사용하는 속성 선택자
        * : 값의 포함 여부
        ^ : 값의 시작 요부
        $ : 값의 끝 여부
        */
        img[width *= "5"]{
            border: 5px dashed red;      
        }

        p > em{
            color: blue;
        }

        /*
        형제 선택자는 뒤이어 등장하는 형제들을 대상으로 한다!
        */

        #sam ~ p{
        color: orange;
        }

    </style>
</head>
<body>
    <img src="images/seoul.jpg" width="120px" alt="서울">
    <img src="images/seoul.jpg" width="120px">
    <img src="images/seoul.jpg" width="120px" id="sam">

    <p>서울은 대한민국의 수도이자 최대 도시로, 정치, 경제, 문화의 중심지입니다</p>
    <p>한강을 중심으로 도시가 발달했으며, 고궁과 현대 건축물이 공존합니다.</p>
    <p>세계적인 대중교통 시스템과 <em>ICT 인프라</em>로 유명합니다.</p>
    <p>역사와 현대가 어우러진 매력적인 글로벌 도시입니다.</p>
    
</body>
</html>
