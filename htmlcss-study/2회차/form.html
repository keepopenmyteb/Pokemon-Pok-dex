<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문조사 양식</title>
</head>
<body>
    <hader>
    <h1>설문조사 양식</h1>
    <p>모든 항목에 바짐없이 체크해주세요</p>
    </hader>
    <hr>
    <main>
    <form>
        <fieldset>
            <legend>게인정보</legend>
            <lrbrl for="name">이름</lrbrl>
            <input type="text"
            name="name"
            id="name" placeholder="본명을 입력하세요">
            <lrbrl for="emaile">이메일</lrbrl>
            <input type="email" 
            name="email"
            id="emaile" placeholder="메일 주소 쓰세요">
        </fieldset>
        <fieldset>
            <legend>설문</legend>

            <p>연령대가 어떻게 되십니까?</p>
            <input type="radio" id="teen" name="age">
            <label for="teen">10대</label>
            <input type="radio" id="twenty" name="age">
            <label for="twenty">20대</label>
            <input type="radio" id="thirty" name="age">
            <label for="thirty">30대</label>
            <input type="radio" id="fourty" name="age">
            <label for="fourty">40대</label>
            <input type="radio" id="fifty" name="age">
            <label for="fifty">50대</label>
            <input type="radio" id="outor" name="age">
            <label for="outor">그 외</label>

            <p>학원을 선택 시 그 기준은 어떻게 되시나요?</p>
            <input type="checkbox" id="placeholder" name="academy">
            <label for="placeholder">위치</label>
            <input type="checkbox" id="price" name="academy">
            <label for="price">가격</label>
            <input type="checkbox" id="teacher" name="academy">
            <label for="teacher">강사</label>
            <input type="checkbox" id="infra" name="academy">
            <label for="infra">시설</label>
            

        </fieldset>
        <fieldset>
            <legend>기타 의견</legend>
            <textarea rows="3" cols="30" name="comment"></textarea>
        </fieldset>
        <input typp="submit">
    </form>
    </main>
        <hr>
        <footer>
        <p>입력하느라 수고하셧습니다</p>
        </footer>
</body>
</html>
